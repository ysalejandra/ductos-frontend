<!-- Cotización-->
<section class="page-section" id="cotizacion">
    <div class="container">
        <div class="text-center">
            <h2 class="section-heading text-uppercase">Cotiza con nosotros!</h2>
            <!-- <h3 class="section-subheading text-muted">Lorem ipsum dolor sit amet consectetur.</h3> -->
        </div>
        <br>
        <form [formGroup]='clienteForm' id="cotizacionForm">
            <div class="row align-items-stretch mb-5">
                <div class="col-md-6">
                    <div class="form-group">
                        <!-- Nombre input-->
                        <input type="text" class="form-control" #nombre formControlName="nombre"  placeholder="Tu nombre*">
                    </div>
                    <div class="form-group">
                        <!-- Apellido Paterno input-->
                        <input type="text" class="form-control" #apellidoPaterno formControlName="apellidoPaterno"  placeholder="Tu apellido paterno*">
                    </div>
                    <div class="form-group">
                        <!-- Apellido Materno input-->
                        <input type="text" class="form-control" #apellidoMaterno formControlName="apellidoMaterno"  placeholder="Tu apellido Materno*">
                    </div>
                    <div class="form-group">
                        <!-- correo input-->
                        <input type="email" class="form-control" #apellidoMaterno formControlName="email"  placeholder="Tu email*">
                    </div>
                    <div class="form-group">
                        <!-- telefono input-->
                        <input type="text" class="form-control" #telefono formControlName="telefono"  placeholder="Tu telefono*">
                    </div>
                </div>
                <div class="col-md-6">
                    <div class="form-group form-group-textarea mb-md-0">
                        <!-- Message input-->
                        <textarea class="form-control"  placeholder="Tu mensaje*"></textarea>
                    </div>
                </div>
            </div>
            <!-- Submit Button-->
            <div class="text-center">
                <button class="btn btn-primary btn-xl text-uppercase " id="submitButton" 
                (click)="mostrarDialogo()" type="submit">Enviar Cotización</button>
            </div>
        </form>
    </div>
</section>
