<!-- Content Wrapper. Contains page content -->
<div class="content-wrapper" style="max-height: 100%;">
  <!-- Content Header (Page header) -->
  <div class="content-header">
    <div class="container-fluid">
      <h1 class="m-0" style="text-align: center; -webkit-text-stroke-width:thin">Obras</h1>
    </div>
  </div>

  <!-- Main content -->
  <section class="content">
    <div class="container-fluid">
      <div class="section">
        <br>
        <button mat-button color="primary" routerLink="agregar">Agregar</button>
        <br>
        <mat-form-field appearance="standard">
          <mat-label>Buscar</mat-label>
          <input matInput (keyup)="applyFilter($event)" placeholder="Ejemplo: por visitar" #input>
        </mat-form-field>
        <br>
        <div class="mat-elevation-z8">
          <table mat-table [dataSource]="dataSource">
            <!--- Note that these columns can be defined in any order.
            The actual rendered columns are set as a property on the row definition" -->

            <!-- Position Column -->
            <ng-container matColumnDef="idObra">
              <th mat-header-cell *matHeaderCellDef> Id Obra </th>
              <td mat-cell *matCellDef="let element"> {{element.idObra}} </td>
            </ng-container>

            <!-- Name Column -->
            <ng-container matColumnDef="nombre">
              <th mat-header-cell *matHeaderCellDef> Nombre Obra</th>
              <td mat-cell *matCellDef="let element"> {{element.nombre}} </td>
            </ng-container>

            <!-- Weight Column -->
            <ng-container matColumnDef="direccion">
              <th mat-header-cell *matHeaderCellDef> Dirección </th>
              <td mat-cell *matCellDef="let element"> {{element.direccion}} </td>
            </ng-container>

            <!-- Symbol Column -->
            <ng-container matColumnDef="ciudad">
              <th mat-header-cell *matHeaderCellDef> Ciudad </th>
              <td mat-cell *matCellDef="let element"> {{element.ciudad}} </td>
            </ng-container>

            <!-- Symbol Column -->
            <ng-container matColumnDef="acciones">
              <th mat-header-cell *matHeaderCellDef> </th>
              <td mat-cell *matCellDef="let element" style="text-align: right;">
                <a class="pointer" style="color: #30B8C6;" matTooltip="Ver obra">
                  <i class="fas fa-eye" style="font-size:28px;"></i>
                </a>
                <a class="pointer" style="color: seagreen;" matTooltip="Editar obra"
                [routerLink]="['editar', element.idObra]">
                  <i class="fas fa-edit" style="font-size:28px; padding-left: 20px;"></i>
                </a>
                <a class="pointer" style="color:#ED3A3A"  (click)="eliminarObra(element.idObra)" matTooltip="Eliminar obra">
                  <i class="fas fa-trash-alt" style="font-size:28px; padding-left: 20px;"></i>
                </a>
              </td>
            </ng-container>
            <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
            <tr mat-row *matRowDef="let row; columns: displayedColumns;"></tr>
          </table>
          <mat-paginator [pageSizeOptions]="[6, 10, 25, 100]" aria-label="Select page of users"></mat-paginator>
        </div>
      </div>
    </div>
  </section>
</div>
