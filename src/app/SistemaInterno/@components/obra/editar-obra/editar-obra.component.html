<div class="body">
    <div class="format">
        <h1 class="ancho">Editar Obra</h1>
      <form [formGroup]="obraForm" (ngSubmit)="confirmar()">
        <input type="hidden" formControlName="idObra">
        <mat-form-field appearance="fill" class="ancho">
          <mat-label>Nombre</mat-label>
          <input matInput type="text" autocomplete="off" formControlName="nombre"/>
        </mat-form-field>
        <br />
        <mat-form-field appearance="fill" class="ancho">
          <mat-label>Dirección</mat-label>
          <input matInput type="text" autocomplete="off" formControlName="direccion"/>
        </mat-form-field>
        <br />
        <mat-form-field appearance="fill" class="ancho">
          <mat-label>Ciudad</mat-label>
          <input matInput type="text" autocomplete="off" formControlName="ciudad"/>
        </mat-form-field>
        <br />
        <mat-form-field appearance="fill" class="ancho">
          <mat-label>Descripción</mat-label>
          <textarea matInput type="text" autocomplete="off" formControlName="descripcion"></textarea>
        </mat-form-field>
        <br>
        <button class="ancho button" mat-raised-button color="primary" type= "submit">
          Guardar
        </button>
        <br><br>
        <button class="ancho button cancel" mat-raised-button color="secondary" routerLink="/dashboard/obras">
          Cancelar
        </button>
      </form><br>
    </div>
  </div>
