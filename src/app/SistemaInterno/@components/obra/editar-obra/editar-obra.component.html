<div class="content-wrapper" style="max-height: 92%;">
    <!-- Content Header (Page header) -->
    <div class="content-header">
        <div class="container-fluid">
            <h1 class="m-0" style="text-align: center; -webkit-text-stroke-width:thin">Productos</h1>
        </div>
    </div>

    <!-- Main content -->
    <section class="content">
        <div class="container-fluid" style="width: 80%;">
            <div class="section">
                <br>
                <div class="mat-elevation-z8">

                    <form class="formulario">
                        <mat-form-field appearance="fill" class="ancho">
                            <mat-label>Nombre</mat-label>
                            <input matInput type="text" autocomplete="off" formControlName="nombre" />
                        </mat-form-field>
                        <br />
                        <mat-form-field appearance="fill" class="ancho">
                            <mat-label>Categoria</mat-label>
                            <input matInput type="text" autocomplete="off" formControlName="categoria" />
                        </mat-form-field>
                        <br />
                        <mat-form-field appearance="fill" class="ancho">
                            <mat-label>Cantidad</mat-label>
                            <input matInput type="number" autocomplete="off" formControlName="cantidad" />
                        </mat-form-field>
                        <br />
                        <mat-form-field appearance="fill" class="ancho">
                            <mat-label>Valor</mat-label>
                            <input matInput type="number" autocomplete="off" formControlName="valor" />
                        </mat-form-field>
                        <br />
                        <mat-form-field appearance="fill" class="ancho">
                            <mat-label>Descripción</mat-label>
                            <textarea matInput type="text" autocomplete="off" formControlName="descripcion"></textarea>
                        </mat-form-field>
                        <br /><br />
                        <button class="button" mat-raised-button color="primary" type="submit">
                            <span style="font-size: 120%">Guardar</span>
                        </button>
                        <button class="button cancel" mat-raised-button color="secondary"
                            routerLink="/dashboard/productos">
                            <span style="font-size: 120%">Cancelar</span>
                        </button>
                    </form>
                </div>
            </div>
        </div>
    </section>
</div>
