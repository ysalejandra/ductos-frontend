<mat-toolbar class = "titulo" color="secondary">
    <span >Obras</span>
  </mat-toolbar>
  
  <div class="body">
    <div class="format">
        <h1 class="ancho">Editar Producto</h1>
      <form [formGroup]="obraForm" (ngSubmit)="saveData()">
        <input type="hidden" formControlName="idObra">
        <mat-form-field appearance="fill" class="ancho">
          <mat-label>Nombre</mat-label>
          <input matInput type="text" autocomplete="off" formControlName="nombre"/>
        </mat-form-field>
        <br />
        <mat-form-field appearance="fill" class="ancho">
          <mat-label>Dirección</mat-label>
          <input matInput type="text" autocomplete="off" formControlName="direccion"/>
        </mat-form-field>
        <br />
        <mat-form-field appearance="fill" class="ancho">
          <mat-label>Ciudad</mat-label>
          <input matInput type="number" autocomplete="off" formControlName="ciudad"/>
        </mat-form-field>
        <br />
        <button class="ancho button" mat-raised-button color="primary" type= "submit">
          Guardar
        </button>
        <br>
        <button class="ancho button cancel" mat-raised-button color="secondary" routerLink="/dashboard/productos">
          Cancelar
        </button>
      </form>
    </div>
  </div>
