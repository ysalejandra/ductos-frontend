<div class="body">
  <div class="format">
    <!-- Content Wrapper. Contains page content -->
    <div class="content-wrapper" style="max-height: 100%;">
      <!-- Content Header (Page header) -->
      <div class="content-header">
        <div class="container-fluid">
          <h1 class="m-0" style="text-align: center; -webkit-text-stroke-width:thin">Pedidos</h1>
        </div>
      </div>

      <!-- Main content -->
      <section class="content">
        <div class="container-fluid">
          <div class="section">
            <br>
            <button mat-button color="primary" routerLink="agregar">Agregar</button>
            <br>
            <mat-form-field appearance="standard">
              <mat-label>Buscar</mat-label>
              <input matInput (keyup)="applyFilter($event)" placeholder="Ejemplo: Recibido" #input>
            </mat-form-field>
            <br>
            <div class="mat-elevation-z8">
              <table mat-table [dataSource]="dataSource" matSort>
                <!--- Note that these columns can be defined in any order.
              The actual rendered columns are set as a property on the row definition" -->

                <!-- Position Column -->
                <ng-container matColumnDef="idPedido">
                  <th mat-header-cell *matHeaderCellDef> Id Pedido </th>
                  <td mat-cell *matCellDef="let element"> {{element.idPedido}} </td>
                </ng-container>

                <!-- Name Column -->
                <ng-container matColumnDef="codigoSeguimiento">
                  <th mat-header-cell *matHeaderCellDef> Código de seguimiento</th>
                  <td mat-cell *matCellDef="let element"> {{element.codigoSeguimiento}} </td>
                </ng-container>

                <!-- Weight Column -->
                <ng-container matColumnDef="estadoPedido">
                  <th mat-header-cell *matHeaderCellDef mat-sort-header> Estado del pedido </th>
                  <td mat-cell *matCellDef="let element">
                    <span *ngIf="element.estadoPedido === 'RECIBIDO'" class="badge badge-primary">Recibido</span>
                    <span *ngIf="element.estadoPedido === 'ENPROCESO'" class="badge badge-info">En proceso</span>
                    <span *ngIf="element.estadoPedido === 'FINALIZADO'" class="badge badge-success">Finalizado</span>
                    <span *ngIf="element.estadoPedido === 'COTIZACION'" class="badge badge-warning">Cotización</span>
                  </td>
                </ng-container>

                <!-- Symbol Column -->
                <ng-container matColumnDef="fechaIngreso">
                  <th mat-header-cell *matHeaderCellDef > Fecha de Ingreso </th>
                  <td mat-cell *matCellDef="let element"> {{element.fechaIngreso | date : 'dd/MM/yyyy'}} </td>
                </ng-container>

                <!-- Symbol Column -->
                <ng-container matColumnDef="fechaEntrega">
                  <th mat-header-cell *matHeaderCellDef> Fecha de Entrega </th>
                  <td mat-cell *matCellDef="let element"> {{element.fechaEntrega | date : 'dd/MM/yyyy'}} </td>
                </ng-container>

                <!-- Symbol Column -->
                <ng-container matColumnDef="acciones">
                  <th mat-header-cell *matHeaderCellDef> </th>
                  <td mat-cell *matCellDef="let element" style="text-align: right;">
                    <a class="pointer" style="color: #30B8C6;" matTooltip="Ver Pedido"
                      [routerLink]="['ver', element.idPedido]">
                      <i class="fas fa-eye" style="font-size:28px;"></i>
                    </a>
                    <a class="pointer" style="color: seagreen;" matTooltip="Editar Pedido"
                      [routerLink]="['editar', element.idPedido]">
                      <i class="fas fa-edit" style="font-size:28px; padding-left: 20px;"></i>
                    </a>
                    <a class="pointer" style="color:#ED3A3A" (click)="confirmar(element.idPedido)"
                      matTooltip="Eliminar Pedido">
                      <i class="fas fa-trash-alt" style="font-size:28px; padding-left: 20px;"></i>
                    </a>
                  </td>
                </ng-container>
                <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
                <tr mat-row *matRowDef="let row; columns: displayedColumns;"></tr>
              </table>
              <mat-paginator [pageSizeOptions]="[6, 10, 25, 100]" aria-label="Select page of users"></mat-paginator>
            </div>
          </div>
        </div>
      </section>
    </div>
  </div>
</div>
