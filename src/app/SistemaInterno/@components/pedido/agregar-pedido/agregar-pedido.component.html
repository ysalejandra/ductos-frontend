<div class="body">
    <div class="format">
      <h1 class="ancho titulo">Agregar Pedido</h1><br>
      <form [formGroup]="pedidoForm"   class="formulario">


        <mat-form-field appearance="fill" class="ancho">
            <mat-label>Fecha de ingreso</mat-label>
            <input matInput [matDatepicker]="picker" formControlName="fechaIngreso">
            <mat-datepicker-toggle matSuffix [for]="picker"></mat-datepicker-toggle>
            <mat-datepicker #picker></mat-datepicker>
          </mat-form-field>
          
        <br />
        <!--<mat-form-field appearance="fill" class="ancho">
          <mat-label>Fecha entrega</mat-label>
          <input matInput type="text" autocomplete="off" formControlName="fechaEntrega" />
        </mat-form-field>-->

        
        <mat-form-field appearance="fill" class="ancho">
            <mat-label>Fecha de entrega</mat-label>
            <input matInput [matDatepicker]="picker2" formControlName="fechaEntrega">
            <mat-datepicker-toggle matSuffix [for]="picker2"></mat-datepicker-toggle>
            <mat-datepicker #picker2></mat-datepicker>
          </mat-form-field>
        <br />
        <mat-form-field appearance="fill" class="ancho">
          <mat-label>Anotaciones</mat-label>
          <input matInput type="text" autocomplete="off" formControlName="anotaciones" />
        </mat-form-field>
        <br />

        <mat-form-field appearance="fill" class="ancho">
            <mat-label>Estado del pedido</mat-label>
            <mat-select formControlName="estadoPedido">
                <mat-option value="RECIBIDO">
                    Recibido
                </mat-option>
                <mat-option value="ENPROCESO">
                    En proceso
                </mat-option>
              
                <mat-option value="COTIZACION">
                    Cotización
                </mat-option>
                <mat-option value="FINALIZADO">
                    Finalizado
                </mat-option>
            </mat-select>
          </mat-form-field>
        <br />
        <br /><br />
        <button class="button ancho button" mat-raised-button color="primary" (click)="confirmar()" type="submit">
          Guardar
        </button>
        <div *ngIf="ocultar">
          <div class="alert alert-sucess" role="alert">
              ¡Se ha enviado la cotización correctamente!
          </div>
      </div>
      </form>
    </div>
  </div>
