<!-- Content Wrapper. Contains page content -->
<div class="content-wrapper" style="max-height: 100%;">
    <!-- Content Header (Page header) -->
    <div class="content-header">
      <div class="container-fluid">
        <h1 class="m-0" style="text-align: center; -webkit-text-stroke-width:thin">Pedido del cliente </h1>
      </div>
    </div>
  
    <!-- Main content -->
    <section class="content">
      <div class="container-fluid">
        <div class="section">
        <br>
          <div class="mat-elevation-z8">
            <table mat-table [dataSource]="dataSource" matSort>
              <!--- Note that these columns can be defined in any order.
            The actual rendered columns are set as a property on the row definition" -->
  
              <!-- Position Column -->
              <ng-container matColumnDef="idPedido">
                <th mat-header-cell *matHeaderCellDef mat-sort-header> Id Pedido </th>
                <td mat-cell *matCellDef="let element"> {{element.idCliente}} </td>
              </ng-container>
  
              <!-- Name Column -->
              <ng-container matColumnDef="codigoSeguimiento">
                <th mat-header-cell *matHeaderCellDef> Código de seguimiento </th>
                <td mat-cell *matCellDef="let element"> {{element.nombre}} {{element.apellidoPaterno}}
                  {{element.apellidoMaterno}} </td>
              </ng-container>
  
              <!-- Weight Column -->
              <ng-container matColumnDef="estadoPedido">
                <th mat-header-cell *matHeaderCellDef> estado del pedido </th>
                <td mat-cell *matCellDef="let element"> {{element.email}} </td>
              </ng-container>
  
              <!-- Symbol Column -->
              <ng-container matColumnDef="valorPedido">
                <th mat-header-cell *matHeaderCellDef> Valor del pedido </th>
                <td mat-cell *matCellDef="let element"> {{element.telefono}} </td>
              </ng-container>
  
              <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
              <tr mat-row *matRowDef="let row; columns: displayedColumns;"></tr>
            </table>
            <mat-paginator [pageSizeOptions]="[8, 10, 25, 100]" aria-label="Select page of users"></mat-paginator>
          </div>
        </div>
      </div>
    </section>
  </div>
