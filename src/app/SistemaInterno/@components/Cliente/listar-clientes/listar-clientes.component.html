<!-- Content Wrapper. Contains page content -->
<div class="content-wrapper" style="max-height: 100%;">
  <!-- Content Header (Page header) -->
  <div class="content-header">
    <div class="container-fluid">
      <h1 class="m-0" style="text-align: center; -webkit-text-stroke-width:thin">Clientes</h1>
    </div>
  </div>

  <!-- Main content -->
  <section class="content">
    <div class="container-fluid">
      <div class="section">
        <br>
        <button mat-button color="primary" routerLink="agregar">Agregar</button>
        <br>
        <mat-form-field appearance="standard">
          <mat-label>Buscar</mat-label>
          <input matInput (keyup)="applyFilter($event)" placeholder="Ejemplo: por visitar" #input>
        </mat-form-field>
        <br>
        <div class="mat-elevation-z8">
          <table mat-table [dataSource]="dataSource" matSort>
            <!-- Position Column -->
            <!--<ng-container matColumnDef="idCliente">
              <th mat-header-cell *matHeaderCellDef mat-sort-header> Id Cliente </th>
              <td mat-cell *matCellDef="let element"> {{element.idCliente}} </td>
            </ng-container>-->

            <!-- Name Column -->
            <ng-container matColumnDef="nombre">
              <th mat-header-cell *matHeaderCellDef> Nombre </th>
              <td mat-cell *matCellDef="let element"> {{element.nombre}} {{element.apellidoPaterno}}
                {{element.apellidoMaterno}} </td>
            </ng-container>

            <!-- Weight Column -->
            <ng-container matColumnDef="email">
              <th mat-header-cell *matHeaderCellDef> Correo </th>
              <td mat-cell *matCellDef="let element"> {{element.email}} </td>
            </ng-container>

            <!-- Symbol Column -->
            <ng-container matColumnDef="telefono">
              <th mat-header-cell *matHeaderCellDef> Telefono </th>
              <td mat-cell *matCellDef="let element"> {{element.telefono}} </td>
            </ng-container>

            <!-- Symbol Column -->
            <ng-container matColumnDef="cantidad">
              <th mat-header-cell *matHeaderCellDef> Cantidad </th>
              <td mat-cell *matCellDef="let element"> {{element.cantidad}} </td>
            </ng-container>

            <!-- Symbol Column -->
            <ng-container matColumnDef="valor">
              <th mat-header-cell *matHeaderCellDef> valor </th>
              <td mat-cell *matCellDef="let element"> {{element.valor}} </td>
            </ng-container>

            <!-- Symbol Column -->
            <ng-container matColumnDef="acciones">
              <th mat-header-cell *matHeaderCellDef> </th>
              <td mat-cell *matCellDef="let element" style="text-align: right;">
                <a class="pointer" style="color: seagreen;" matTooltip="Editar cliente"
                [routerLink]="['editar', element.idCliente]">
                  <i class="fas fa-edit" style="font-size:28px; padding-left: 20px;"></i>
                </a>
                <a class="pointer" style="color:#ED3A3A" (click)="confirmar(element.idCliente)"
                  matTooltip="Eliminar cliente">
                  <i class="fas fa-trash-alt" style="font-size:28px; padding-left: 20px;"></i>
                </a>
              </td>
            </ng-container>
            <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
            <tr mat-row *matRowDef="let row; columns: displayedColumns;"></tr>
          </table>
          <mat-paginator [pageSizeOptions]="[8, 10, 25, 100]" aria-label="Select page of users"></mat-paginator>
        </div>
      </div>
    </div>
  </section>
</div>
