<mat-toolbar class = "titulo" color="secondary">
    <span >Cliente</span>
  </mat-toolbar>
  
  <div class="body">
    <div class="format">
        <h1 class="ancho">Editar Cliente</h1>
      <form [formGroup]="clienteForm" (ngSubmit)="confirmar()">
        <input type="hidden" formControlName="idCliente">
        <mat-form-field appearance="fill" class="ancho">
          <mat-label>Nombre</mat-label>
          <input matInput type="text" autocomplete="off" formControlName="nombre"/>
        </mat-form-field>
        <br />
        <mat-form-field appearance="fill" class="ancho">
          <mat-label>apellidoPaterno</mat-label>
          <input matInput type="text" autocomplete="off" formControlName="apellidoPaterno"/>
        </mat-form-field>
        <br />
        <mat-form-field appearance="fill" class="ancho">
            <mat-label>apellidoMaterno</mat-label>
            <input matInput type="text" autocomplete="off" formControlName="apellidoMaterno"/>
          </mat-form-field>
          <br />
        <mat-form-field appearance="fill" class="ancho">
          <mat-label>Email</mat-label>
          <input matInput type="email" autocomplete="off" formControlName="email"/>
        </mat-form-field>
        <br />
        <mat-form-field appearance="fill" class="ancho">
          <mat-label>Teléfono</mat-label>
          <input matInput type="string" autocomplete="off" formControlName="telefono"/>
        </mat-form-field>
        <br />
        <button class="ancho button" mat-raised-button color="primary" type= "submit">
          Guardar
        </button>
        <br>
        <button class="ancho button cancel" mat-raised-button color="secondary" routerLink="/dashboard/clientes">
          Cancelar
        </button>
      </form>
    </div>
  </div>
