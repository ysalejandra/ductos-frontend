
<div
    role="dialog">
    <div class="modal-dialog modal-xl">
        <div class="modal-content">
            <!--Empieza el formulario addPedidoService.oculto
            <form [formGroup]='formInsumos' (ngSubmit)="saveData()" novalidate>-->
            <!--Modal Header-->


            <div class="modal-header">
                <h3 class="modal-title">Agregar Cliente</h3>
                <!--<button (click)="ocultarModal()" type="button" class="close" data-dismiss="modal">&times;</button>-->
            </div>

            <form [formGroup]='clienteForm'>
                <!--Modal Header-->
                <div class="modal-header">
                    <h3 class="modal-title">Agregar Cliente</h3>
                    <!--<button (click)="ocultarModal()" type="button" class="close" data-dismiss="modal">&times;</button>!-->
                </div>

                <!--Modal Body-->
                <div class="modal-body">
                    <div class="card" id="tarjeta">
                        <!--Nombre-->
                        <div class="form-group row">
                            <label class="col-4 col-form-label">
                                <h6>Nombre</h6>
                            </label>
                            <div class="col-8">
                                <input class="form-control" #nombre formControlName="nombre" type="text">
                            </div>
                        </div>

                        <div class="form-group row">
                            <label class="col-4 col-form-label">
                                <h6>Apellido paterno</h6>
                            </label>
                            <div class="col-8">
                                <input class="form-control" #apellidoPaterno formControlName="apellidoPaterno" type="text">
                            </div>
                        </div>

                        <div class="form-group row">
                            <label class="col-4 col-form-label">
                                <h6>Apellido materno</h6>
                            </label>
                            <div class="col-8">
                                <input class="form-control" #apellidoMaterno formControlName="apellidoMaterno" type="text">
                            </div>
                        </div>

                        <div class="form-group row">
                            <label class="col-4 col-form-label">
                                <h6>Email</h6>
                            </label>
                            <div class="col-8">
                                <input class="form-control" #email formControlName="email" type="email">
                            </div>
                        </div>

                        <div class="form-group row">
                            <label class="col-4 col-form-label">
                                <h6>Telefono</h6>
                            </label>
                            <div class="col-8">
                                <input class="form-control" #telefono formControlName="telefono" type="text">
                            </div>
                        </div>

                    </div>
                    <br>
                    <!--Modal footer-->
                    <div class="modal-footer">
                        <button type="submit" class="btn btn-primary" (click)="saveData()">Guardar</button>
                        <button (click)="ocultarModal()" type="button" style="background-color: red; color: white;"
                            class="btn btn-danexampleModalger">Cerrar</button>

                    </div>
                </div>
            </form>
        </div>
    </div>
</div>
