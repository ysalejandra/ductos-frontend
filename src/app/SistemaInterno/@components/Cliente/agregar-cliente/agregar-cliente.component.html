<div class="body">
    <div class="format">
        <h1 class="ancho titulo">Agregar Cliente</h1>
        <form [formGroup]="clienteForm" (ngSubmit)="confirmar()">
            <mat-form-field appearance="fill" class="ancho">
                <mat-label>Nombre</mat-label>
                <input matInput #nombre type="text" autocomplete="off" formControlName="nombre" />
            </mat-form-field>
            <br />
            <mat-form-field appearance="fill" class="ancho">
                <mat-label>Apellido Paterno</mat-label>
                <input matInput  #apellidoPaterno formControlName="apellidoPaterno" type="text"
                    autocomplete="off" />
            </mat-form-field>
            <br />
            <mat-form-field appearance="fill" class="ancho">
                <mat-label>Apellido Materno</mat-label>
                <input matInput  #apellidoMaterno formControlName="apellidoMaterno" type="text"
                    autocomplete="off" />
            </mat-form-field>
            <br />
            <mat-form-field appearance="fill" class="ancho">
                <mat-label>Email</mat-label>
                <input matInput  #email formControlName="email" type="email" autocomplete="off" />
            </mat-form-field>
            <br />
            <mat-form-field appearance="fill" class="ancho">
              <mat-label>Teléfono</mat-label>
              <span matPrefix>+56 &nbsp;</span>
              <input matInput #telefono  placeholder="" formControlName="telefono" type="number" autocomplete="off" />
                <mat-icon matSuffix>phone</mat-icon>
            </mat-form-field>
            <br />
        <button class="ancho button" mat-raised-button color="primary" type= "submit">
          Guardar
        </button>
        <br><br>
        <button class="ancho button cancel" mat-raised-button color="secondary" routerLink="/dashboard/clientes">
          Cancelar
        </button>
      </form><br>
    </div>
  </div>
