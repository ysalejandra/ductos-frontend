<div class="body">
    <div class="format">
        <h1 class="ancho titulo">Agregar Cliente</h1>

        <div class="container mt-5 pt-5">
            <div class="col-12">
                <div class="row">

                    <div class="col-5 pl-5 mt-5">
                        <h1>Line Chart</h1>
                        <br>
                        <h3>Shufle Data</h3>
                        <br>
                        <button class="btn btn-outline-primary" (click)="shuffeData()">Shuffle</button>

                    </div>

                    <div class="col-7">

                        <div class="chart-wrapper">
                            <canvas baseChart [datasets]="lineChartData" [labels]="lineChartLabels"
                                [options]="lineChartOptions" [colors]="lineChartColors" [legend]="lineChartLegend"
                                [chartType]="lineChartType" [plugins]="lineChartPlugins">
                            </canvas>


                        </div>

                    </div>

                </div>
            </div>
        </div>


        <button class="button" mat-raised-button color="primary" (click)="crearPdfClientes()" type="submit">
            Crear PDF de con todos los clientes
        </button>

        <button class="button" mat-raised-button color="primary" (click)="consultarClientes()" type="submit">
            Traer Clientes
        </button>

    </div>
</div>
