
<div class="body">
    <div class="format">
      <h1 class="ancho titulo">Generar informes de...</h1><br>
      <form class="formulario" [formGroup]="obraForm" (ngSubmit)="obtenerProductosDeObra()">
        <h2 class="ancho">Todos los pedidos de una obra</h2>
        <mat-form-field appearance="fill" class="ancho">
            <mat-label>Obra</mat-label>
            <mat-select placeholder="" name="obra" formControlName="obra">
              <mat-option *ngFor="let obra of listObra" [value]="obra.idObra">{{ obra.nombre }}</mat-option>
            </mat-select>
          </mat-form-field>
        <button class="button" mat-raised-button color="primary" type="submit">
            Generar PDF
        </button><br><br>
      </form>

      <h2 class="ancho">Todos los clientes</h2>
      <button class="button" mat-raised-button color="primary"  (click)="obtenerClientesPDF()" type="submit">
        Generar PDF
     </button><br><br>

     <h2 class="ancho">Los productos más comprados</h2>
      <button class="button" mat-raised-button color="primary" (click)="obtenerProductosMasCompradosPDF()" type="submit">
         Generar PDF
      </button><br><br>

      <h2 class="ancho">Los productos que mayor ganancia generan</h2>
      <button class="button" mat-raised-button color="primary" (click)="obtenerProductosConMayorGananciaPDF()" type="submit">
        Generar PDF
      </button><br><br>

      <h2 class="ancho">Los clientes con mayor cantidad de compras</h2>
      <button class="button" mat-raised-button color="primary" (click)="obtenerClientesConMasComprasPDF()" type="submit">
        Generar PDF
      </button> <br><br>

      <h2 class="ancho">Los clientes que entregan mayor ganancia</h2>
      <button class="button" mat-raised-button color="primary" (click)="obtenerClientesConMayorGananciaPDF()" type="submit">
        Generar PDF
      </button> <br><br>
    </div> 
  </div>
