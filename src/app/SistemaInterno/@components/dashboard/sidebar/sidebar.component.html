<!-- Main Sidebar Container -->
<aside class="main-sidebar sidebar-dark-primary elevation-4 sidebar-focus">
  <!-- Brand Logo -->
  <a href="home" class="brand-link">
    <img src="../../../../../assets/img/navbar-logo-ductos.png" alt="AdminLTE Logo" class="brand-image"
      style="max-height: 32px;"><br>
  </a>

  <!-- Sidebar -->
  <div class="sidebar">
    <!-- Sidebar user panel (optional) -->
    <div class="user-panel mt-3 pb-3 mb-3 d-flex">
      <div class="image">
        <img src="../../../../../assets/img/user.png" class="img-circle elevation-2" alt="User Image">
      </div>
      <div class="info">
        <a href="#" class="d-block" style="font-size:16px">{{nombre}}</a><br>
        <span style="color:aliceblue">{{rol}}</span><br>
        <ul class="nav nav-pills nav-sidebar flex-column" data-widget="treeview" role="menu">
          <li class="nav-item">
            <a (click)="salir()" class="nav-link" style="font-size:16px">
              <i class="fas fa-sign-out-alt"></i>
              Cerrar sesión
            </a>
          </li>
        </ul>
      </div>
    </div>


    <!-- Sidebar Menu -->
    <nav class="mt-2">
      <ul class="nav nav-pills nav-sidebar flex-column" data-widget="treeview" role="menu">
        <!-- Add icons to the links using the .nav-icon class
               with font-awesome or any other icon font library -->
        <li class="nav-item" *ngFor="let item of menu">
          <a [routerLink]="[item.redirect]" class="nav-link" style="font-size:16px">
            <i class="{{item.icono}}"></i>
            <p>
              {{item.nombre}}
            </p>
          </a>
        </li>
      </ul>
    </nav>
    <!-- /.sidebar-menu -->
  </div>
  <!-- /.sidebar -->
</aside>

<!-- Control Sidebar -->
<aside class="control-sidebar control-sidebar-dark">
  <!-- Control sidebar content goes here -->
</aside>

<script>
  $("#my-toggle-button").controlSidebar(options);
</script>

<script>
  $.widget.bridge('uibutton', $.ui.button)
</script>

<script src="plugins/overlayScrollbars/js/jquery.overlayScrollbars.min.js"></script>
