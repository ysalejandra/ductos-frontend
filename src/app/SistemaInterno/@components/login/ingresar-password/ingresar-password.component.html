<div class="body">
    <div class="login">
        <form  [formGroup]="form" (ngSubmit)="actualizarPassword()"> 
            <img src="../../assets/img/logo.jpg" style="width: 20%;" >
            <h1>Recuperar contraseña</h1>
            <h3>Ingresa tu nueva contraseña</h3>
            <mat-form-field class ="ancho" appearance="fill">
                <mat-label>Contraseña</mat-label>
                <input type="password" matInput autocomplete="off" formControlName="password">
            </mat-form-field>
            <br>
            <h3>Ingresa tu nueva contraseña nuevamente</h3>
            <mat-form-field class ="ancho" appearance="fill">
                <mat-label>Contraseña</mat-label>
                <input type="password" matInput autocomplete="off" formControlName="confirmarPassword">
            </mat-form-field>
            <br>
            <button type= "submit" class ="ancho button"  mat-raised-button color="primary" [disabled]="form.invalid">Ingresar</button>
        </form>
    </div>
</div>
