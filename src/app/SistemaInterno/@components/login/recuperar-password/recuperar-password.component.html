
<div class="body">
    <div class="login">
        
        <form [formGroup]="form" (ngSubmit)="enviarCorreo()"> 
            <img src="../../assets/img/logo.jpg" style="width: 20%;" > <!--Ruta relativa-->
            <br><br>
            <mat-spinner class="spinner" *ngIf="loading" diameter="40"></mat-spinner>
            <h1>Recuperar contraseña</h1>
            <h3>Ingresa tu correo electrónico para recuperar tu contraseña</h3>
            <mat-form-field class ="ancho" appearance="fill">
                <mat-label>Correo</mat-label>
                <input type="text" matInput autocomplete="off" formControlName="mailTo">
            </mat-form-field>
            <br>
            <button type= "submit" class ="ancho button"  mat-raised-button color="primary" [disabled]="form.invalid">Ingresar</button>
        </form>
    </div>
</div>
