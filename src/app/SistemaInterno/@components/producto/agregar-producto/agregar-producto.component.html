<div class="body">
  <div class="format">
    <h1 class="ancho titulo">Agregar Producto</h1><br>
    <form [formGroup]="productoForm"   class="formulario">
      <mat-form-field appearance="fill" class="ancho">
        <mat-label>Nombre</mat-label>
        <input matInput type="text" autocomplete="off" formControlName="nombre" />
      </mat-form-field>
      <br />
      <mat-form-field appearance="fill" class="ancho">
        <mat-label>Categoria</mat-label>
        <input matInput type="text" autocomplete="off" formControlName="categoria" />
      </mat-form-field>
      <br />
      <mat-form-field appearance="fill" class="ancho">
        <mat-label>Cantidad</mat-label>
        <input matInput type="number" autocomplete="off" formControlName="cantidad" />
      </mat-form-field>
      <br />
      <mat-form-field appearance="fill" class="ancho">
        <mat-label>Valor</mat-label>
        <input matInput type="number" autocomplete="off" formControlName="valor" />
      </mat-form-field>
      <br />
      <mat-form-field appearance="fill" class="ancho">
        <mat-label>Descripción</mat-label>
        <textarea matInput type="text" autocomplete="off" formControlName="descripcion"></textarea>
      </mat-form-field>
      <br /><br />
      <button class="button ancho button" mat-raised-button color="primary" (click)="confirmar()" type="submit">
        Guardar
      </button>
      <div *ngIf="ocultar">
        <div class="alert alert-sucess" role="alert">
            ¡Se ha enviado la cotización correctamente!
        </div>
    </div>
    </form>
  </div>
</div>
