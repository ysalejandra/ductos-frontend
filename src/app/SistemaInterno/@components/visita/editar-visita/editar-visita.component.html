<mat-toolbar class = "titulo" color="secondary">
    <span >Visita</span>
  </mat-toolbar>
  
  <div class="body">
    <div class="format">
        <h1 class="ancho">Editar Producto</h1>
      <form [formGroup]="visitaForm" (ngSubmit)="saveData()">
        <input type="hidden" formControlName="idVisita">
        <mat-form-field appearance="fill" class="ancho">
          <mat-label>Fecha visita</mat-label>
          <input matInput type="text" autocomplete="off" formControlName="fechaVisita"/>
        </mat-form-field>
        <br />
        <mat-form-field appearance="fill" class="ancho">
          <mat-label>Estado de visita</mat-label>
          <input matInput type="text" autocomplete="off" formControlName="estadoVisita"/>
        </mat-form-field>
        <br />
        <mat-form-field appearance="fill" class="ancho">
          <mat-label>Observaciones</mat-label>
          <input matInput type="text" autocomplete="off" formControlName="observaciones"/>
        </mat-form-field>
        <br />
        <mat-form-field appearance="fill" class="ancho">
          <mat-label>Dirección</mat-label>
          <input matInput type="text" autocomplete="off" formControlName="direccionVisita"/>
        </mat-form-field>
        <br />
        <button class="ancho button" mat-raised-button color="primary" type= "submit">
          Guardar
        </button>
        <br>
      </form>
    </div>
  </div>
