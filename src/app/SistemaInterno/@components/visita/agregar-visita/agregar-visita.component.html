<div class="body">
    <div class="format">
        <h1 class="ancho">Agregar Visita</h1>
      <form [formGroup]="visitaForm" (ngSubmit)="guardar()">
        <mat-form-field appearance="fill" class="ancho">
          <mat-label>Fecha de Visita</mat-label>
          <input matInput type="text" autocomplete="off" formControlName="fechaVisita"/>
        </mat-form-field>
        <br />
        <mat-form-field appearance="fill" class="ancho">
          <mat-label>Estado de visita</mat-label>
          <input matInput type="text" autocomplete="off" formControlName="estadoVisita"/>
        </mat-form-field>
        <br />
        <mat-form-field appearance="fill" class="ancho">
          <mat-label>Observaciones</mat-label>
          <input matInput type="number" autocomplete="off" formControlName="observaciones"/>
        </mat-form-field>
        <br />
        <mat-form-field appearance="fill" class="ancho">
          <mat-label>Dirección</mat-label>
          <input matInput type="number" autocomplete="off" formControlName="direccionVisita"/>
        </mat-form-field>
        <br />
        <button class="ancho button" mat-raised-button color="primary" type= "submit">
          Guardar
        </button>
      </form>
    </div>
  </div>
