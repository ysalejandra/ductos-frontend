<div class="body">
  <div class="format">
      <h1 class="ancho">Editar Trabajador</h1>
    <form [formGroup]="trabajadorForm" (ngSubmit)="confirmar()">
      <input type="hidden" formControlName="rut">
      <mat-form-field appearance="fill" class="ancho">
        <mat-label>Nombre</mat-label>
        <input matInput type="text" autocomplete="off" formControlName="nombre"/>
      </mat-form-field>
      <br />
      <mat-form-field appearance="fill" class="ancho">
        <mat-label>Apellido Paterno</mat-label>
        <input matInput type="text" autocomplete="off" formControlName="apellidoPaterno"/>
      </mat-form-field>
      <br />
      <mat-form-field appearance="fill" class="ancho">
        <mat-label>Apellido Materno</mat-label>
        <input matInput type="text" autocomplete="off" formControlName="apellidoMaterno"/>
      </mat-form-field>
      <br />
      <mat-form-field appearance="fill" class="ancho">
        <mat-label>Fecha de Nacimiento</mat-label>
        <input value="{{fechaDeNacimiento | date: 'yyyy-MM-dd' }}" matInput [matDatepicker]="picker2" formControlName="fechaNacimiento">
        <mat-datepicker-toggle matSuffix [for]="picker2"></mat-datepicker-toggle>
        <mat-datepicker #picker2></mat-datepicker>
      </mat-form-field>
      <br />
      <mat-form-field appearance="fill" class="ancho">
        <mat-label>Email</mat-label>
        <input matInput type="email" autocomplete="off" formControlName="email"/>
      </mat-form-field>
      <br />
      <mat-form-field appearance="fill" class="ancho">
        <mat-label>Teléfono</mat-label>
        <input matInput type="text" autocomplete="off"formControlName="telefono">
      </mat-form-field>
      <br />
      <button class="ancho button" mat-raised-button color="primary" type= "submit">
        Guardar
      </button>
      <br><br>
      <button class="ancho button cancel" mat-raised-button color="secondary" routerLink="/dashboard/trabajadores">
        Cancelar
      </button>
    </form><br>
  </div>
</div>
