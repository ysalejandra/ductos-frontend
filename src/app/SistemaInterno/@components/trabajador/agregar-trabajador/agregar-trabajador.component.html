<div class="body">
  <div class="format">
    <h1 class="ancho titulo">Agregar Trabajador</h1><br>
    <form [formGroup]="trabajadorForm" (ngSubmit)="confirmar()">
      <mat-form-field appearance="fill" class="ancho">
        <mat-label>Rut</mat-label>
        <input matInput type="text" autocomplete="off" formControlName="rut" />
      </mat-form-field>
      <br />
      <mat-form-field appearance="fill" class="ancho">
        <mat-label>Nombre</mat-label>
        <input matInput type="text" autocomplete="off" formControlName="nombre" />
      </mat-form-field>
      <br />
      <mat-form-field appearance="fill" class="ancho">
        <mat-label>Apellido Paterno</mat-label>
        <input matInput type="text" autocomplete="off" formControlName="apellidoPaterno" />
      </mat-form-field>
      <br />
      <mat-form-field appearance="fill" class="ancho">
        <mat-label>Apellido Materno</mat-label>
        <input matInput type="text" autocomplete="off" formControlName="apellidoMaterno" />
      </mat-form-field>
      <br />
      <mat-form-field appearance="fill" class="ancho">
        <mat-label>Fecha de Nacimiento</mat-label>
        <input matInput [matDatepicker]="picker2" formControlName="fechaNacimiento">
        <mat-datepicker-toggle matSuffix [for]="picker2"></mat-datepicker-toggle>
        <mat-datepicker #picker2></mat-datepicker>
      </mat-form-field>
      <br />
      <mat-form-field appearance="fill" class="ancho">
        <mat-label>Correo</mat-label>
        <input matInput  placeholder="trabajador@gmail.com" autocomplete="off" formControlName="email" required/>
        <mat-error *ngIf="trabajador.email.invalid">El correo es invalido</mat-error>
      </mat-form-field>
      <br />
      <mat-form-field appearance="fill" class="ancho">
        <mat-label>Contraseña</mat-label>
        <input matInput [type]="hide ? 'password' : 'text'" autocomplete="off" formControlName="password" />
        <button mat-icon-button matSuffix (click)="hide = !hide" [attr.aria-label]="'Hide password'" [attr.aria-pressed]="hide">
          <mat-icon>{{hide ? 'visibility_off' : 'visibility'}}</mat-icon>
        </button>
      </mat-form-field>
      <br />
      <mat-form-field appearance="fill" class="ancho">
        <mat-label>Teléfono</mat-label>
        <span matPrefix>+56 &nbsp;</span>
        <input matInput #telefono  placeholder="" formControlName="telefono" type="number" autocomplete="off" />
          <mat-icon matSuffix>phone</mat-icon>
      </mat-form-field>
      <br />
      <button class="ancho button" mat-raised-button color="primary" type= "submit">
        Guardar
      </button>
      <br><br>
      <button class="ancho button cancel" mat-raised-button color="secondary" routerLink="/dashboard/trabajadores">
        Cancelar
      </button>
    </form><br>
  </div>
</div>
