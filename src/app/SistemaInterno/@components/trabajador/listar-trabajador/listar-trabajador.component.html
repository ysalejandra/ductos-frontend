

<mat-form-field appearance="standard">
    <mat-label>Filter</mat-label>
    <input matInput (keyup)="applyFilter($event)" placeholder="Ex. ium" #input>
  </mat-form-field>
  
  <button mat-button color="primary" (click)="agregar()">Agregar</button>
  <div class="mat-elevation-z8">
    <table mat-table [dataSource]="dataSourse">
      <!--- Note that these columns can be defined in any order.
            The actual rendered columns are set as a property on the row definition" -->
    
      <!-- Position Column -->
      <ng-container matColumnDef="rut">
        <th mat-header-cell *matHeaderCellDef> Rut </th>
        <td mat-cell *matCellDef="let element"> {{element.rut}} </td>
      </ng-container>
    
      <!-- Name Column -->
      <ng-container matColumnDef="nombre">
        <th mat-header-cell *matHeaderCellDef> Nombre </th>
        <td mat-cell *matCellDef="let element"> {{element.nombre}}  {{element.apellidoPaterno}} {{element.apellidoMaterno}}</td>
      </ng-container>

      <!-- Symbol Column -->
      <ng-container matColumnDef="fechaDeNacimiento">
        <th mat-header-cell *matHeaderCellDef> Fecha De nacimiento </th>
        <td mat-cell *matCellDef="let element"> {{element.fechaDeNacimiento}} </td>
      </ng-container>
  
      <!-- Symbol Column -->
      <ng-container matColumnDef="email">
          <th mat-header-cell *matHeaderCellDef> Correo </th>
          <td mat-cell *matCellDef="let element"> {{element.email}} </td>
        </ng-container>
  
        <!-- Symbol Column -->
      <ng-container matColumnDef="telefono">
          <th mat-header-cell *matHeaderCellDef> Teléfono </th>
          <td mat-cell *matCellDef="let element"> {{element.telefono}} </td>
        </ng-container>
  
          <!-- Symbol Column -->
      <ng-container matColumnDef="rol">
        <th mat-header-cell *matHeaderCellDef> Rol </th>
        <td mat-cell *matCellDef="let element"> {{element.rol}} </td>
      </ng-container>

         <!-- Symbol Column -->
      <ng-container matColumnDef="acciones">
          <th mat-header-cell *matHeaderCellDef> </th>
          <td mat-cell *matCellDef="let element" style="text-align: right;"> 
              <a class= "pointer" style="color: turquoise;" matTooltip="Ver usuario">
                  <mat-icon>search</mat-icon>
              </a>
              <a class= "pointer" style="color: seagreen;" matTooltip="Editar usuario">
                  <mat-icon>edit</mat-icon> 
              </a>
              <a class= "pointer" style="color:red" (click)="eliminarTrabajador(element.idDetalle)" matTooltip="Eliminar usuario"> 
                  <mat-icon>delete</mat-icon>
              </a>
          </td>
        </ng-container>
      <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
      <tr mat-row *matRowDef="let row; columns: displayedColumns;"></tr>
    </table>
  
    <mat-paginator [pageSizeOptions]="[5, 10, 25, 100]" aria-label="Select page of users"></mat-paginator>
  </div>
